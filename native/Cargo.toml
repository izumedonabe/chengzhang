[workspace]
resolver = "2"
members = ["crates/cz-llama", "crates/cz-core", "crates/cz-sim", "crates/cz-platform", "crates/cz-mlx", "app"]

[workspace.package]
version = "0.3.2"
edition = "2021"
license = "MIT"
rust-version = "1.89"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Build-time code (proc macros, build scripts) is never shipped: don't strip it. With
# MACOSX_DEPLOYMENT_TARGET set, stripping proc-macro dylibs leaves them unloadable
# ("mis-aligned LINKEDIT string pool") and clean builds fail.
[profile.release.build-override]
debug = true    # with debug info on, cargo doesn't add -C strip=debuginfo
strip = false

# the shell (Tauri, wry, tao…) is optimized for size; the inference path stays at -O3
[profile.release.package."*"]
opt-level = "s"
[profile.release.package.cz-core]
opt-level = 3
[profile.release.package.cz-llama]
opt-level = 3
[profile.release.package.earshot]
opt-level = 3

# mlx-sys with MLX's CPU backend disabled (see third_party/mlx-sys/build.rs)
[patch.crates-io]
mlx-sys = { path = "third_party/mlx-sys" }
