[project]
name = "chengzhang"
version = "0.1.1"
description = "成章 Chengzhang: local, low-latency voice typing with polishing on Apple Silicon (MLX)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "mlx-audio>=0.6.5",
    "mlx-lm>=0.32.2",
    "sounddevice",
    "soundfile",
    "numpy",
    "pywebview>=6",
    "pyobjc-framework-Quartz",
    "pyobjc-framework-ApplicationServices",
]

[project.optional-dependencies]
bench = ["pyarrow"]

[project.scripts]
otl = "chengzhang.cli:main"
otl-app = "chengzhang.app:main"
chengzhang = "chengzhang.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chengzhang"]
