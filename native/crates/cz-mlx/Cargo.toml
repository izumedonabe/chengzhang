[package]
name = "cz-mlx"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "MLX backend for 成章 on macOS: Qwen3.5 (gated delta net) and Qwen3-ASR on mlx-rs"

[dependencies]
cz-core = { path = "../cz-core" }
mlx-rs = { version = "0.34", default-features = false, features = ["metal-jit", "accelerate", "safetensors"] }
serde_json = "1"
unicode-general-category = "1"
