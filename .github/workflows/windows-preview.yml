# Windows preview build: an artifact on the run page, not a release.
name: windows-preview

on:
  push:
    branches: [claude/windows]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      VULKAN_VERSION: 1.4.357.0   # same as llama.cpp's CI
      CZ_VULKAN: "1"
      # MSBuild's tracker paths overflow MAX_PATH deep inside target/: use Ninja and a short dir
      CMAKE_GENERATOR: Ninja
      CARGO_TARGET_DIR: C:\t
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Vulkan SDK
        run: |
          curl.exe -o $env:RUNNER_TEMP/VulkanSDK-Installer.exe -L "https://sdk.lunarg.com/sdk/download/${env:VULKAN_VERSION}/windows/vulkansdk-windows-X64-${env:VULKAN_VERSION}.exe"
          & "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" --accept-licenses --default-answer --confirm-command install
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\${env:VULKAN_VERSION}"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\${env:VULKAN_VERSION}\bin"

      - name: Install Ninja
        run: choco install ninja

      - uses: ilammy/msvc-dev-cmd@v1   # cl.exe / link.exe on PATH for Ninja

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native -> C:\t

      - name: Check platform code first (fast feedback)
        working-directory: native
        run: cargo check --release -p cz-platform -p cz-core

      - name: Build
        working-directory: native
        run: cargo build --release -p chengzhang

      - name: Package
        id: pkg
        shell: pwsh
        run: |
          $ver = (Select-String -Path native/Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $dir = "Chengzhang-windows-x64"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item C:\t\release\chengzhang.exe "$dir/Chengzhang.exe"
          Copy-Item native/tools/windows/README.txt "$dir/README.txt"
          Get-ChildItem $dir | Select-Object Name, Length
          "version=$ver" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: Chengzhang-${{ steps.pkg.outputs.version }}-windows-x64
          path: Chengzhang-windows-x64
