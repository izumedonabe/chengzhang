<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --sun: #EE5A24; --haze: #E8ECE8; --muted: #A9B8BD;
    --display: -apple-system, "PingFang SC", sans-serif;
    --numeral: -apple-system, "PingFang SC", sans-serif;
  }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; cursor: default; user-select: none; }
  body { display: flex; align-items: flex-end; justify-content: center; padding-bottom: 14px; box-sizing: border-box;
         font: 13px/1.4 -apple-system, "PingFang SC", sans-serif; -webkit-font-smoothing: antialiased; }

  .pill {
    display: grid; grid-template-columns: 36px minmax(0, 1fr); align-items: center; gap: 10px;
    width: 288px; height: 60px; padding: 0 18px 0 14px; box-sizing: border-box;
    border-radius: 30px;
    background: rgba(34, 51, 60, 0.86);
    -webkit-backdrop-filter: blur(18px) saturate(1.3); backdrop-filter: blur(18px) saturate(1.3);
    box-shadow: 0 10px 28px rgba(20, 30, 36, 0.28), inset 0 0 0 1px rgba(232, 236, 232, 0.08);
    color: var(--haze);
    opacity: 0; transform: translateY(10px) scale(0.98);
    transition: opacity 0.18s ease, transform 0.18s ease;
  }
  body.on .pill { opacity: 1; transform: none; }
  /* on macOS Liquid Glass the system draws the capsule behind the page (the HUD window
     is transparent): no background of our own, and no slide, since the glass doesn't move */
  html.glass .pill { background: transparent; -webkit-backdrop-filter: none; backdrop-filter: none; box-shadow: none; transform: none; }
  html.glass .label, html.glass .sub { text-shadow: 0 1px 2px rgba(0, 0, 0, 0.35); }
  html.glass .sub { color: #C9D4D7; }

  /* the painting in miniature: the sun and its broken reflection on the water, drawn
     frame by frame (the voice ripples down through the reflection) */
  .sunset { width: 36px; height: 46px; display: block; }

  .label { font: 500 14px/1.2 var(--display); white-space: nowrap; }
  .label .num { font: 12px/1 var(--numeral); color: var(--muted); margin-left: 6px; font-variant-numeric: tabular-nums; }
  .sub { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 3px; min-height: 1.4em; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body class="idle">
  <div class="pill" role="status" aria-live="polite">
    <canvas class="sunset" id="sunset" aria-hidden="true"></canvas>
    <div>
      <div class="label" id="label"></div>
      <div class="sub" id="sub"></div>
    </div>
  </div>
<script>
  const body = document.body, label = document.getElementById("label"), sub = document.getElementById("sub");
  let state = "hidden", lvl = 0;

  function setText(l, s = "", num) {
    label.textContent = l;
    if (num) { const n = document.createElement("span"); n.className = "num"; n.textContent = num; label.append(n); }
    sub.textContent = s;
  }
  // show the end of `t` (the newest words), cut at the front to fit the pill
  function fitTail(el, t) {
    el.textContent = t;
    if (!el.clientWidth || el.scrollWidth <= el.clientWidth) return;  // not laid out yet: leave it to the ellipsis
    let lo = 1, hi = t.length;  // smallest cut that fits
    while (lo < hi) {
      const mid = (lo + hi) >> 1;
      el.textContent = "…" + t.slice(mid);
      if (el.scrollWidth <= el.clientWidth) hi = mid; else lo = mid + 1;
    }
    el.textContent = "…" + t.slice(lo);
  }

  window.hudState = ({ state: s, payload: p }) => {
    state = s;
    if (s === "done" || s === "copied" || s === "learned") settle = 1;
    wake();
    body.className = s === "hidden" ? "idle" : s === "thinking" ? "thinking on" : s === "loading" || s === "waking" || s === "empty" || s === "error" ? "idle on" : "on";
    if (s === "listening") { setText(p && p.mode ? `在听，译成${p.mode}` : "在听", (p && p.hint) || "松开结束，esc 放弃"); lvl = 0; }
    else if (s === "partial") { body.className = "on"; state = "listening"; fitTail(sub, p || ""); }
    else if (s === "thinking") setText("整理中", (p && p.note) || (p && p.mode ? `译成${p.mode}` : ""));
    else if (s === "done") { setText("已输入", "", p && p.done_s != null ? `${p.done_s.toFixed(2)} 秒` : ""); fitTail(sub, (p && p.text) || ""); }
    else if (s === "copied") { setText("已复制，按 ⌘V 粘贴"); if (p && p.auto) sub.textContent = "打开辅助功能权限后可以自动粘贴"; else fitTail(sub, (p && p.text) || ""); }
    else if (s === "empty") setText("没有听到声音", "检查麦克风，或说得再靠近一点");
    else if (s === "waking") setText("正在唤醒模型", "几秒后再按一次");
    else if (s === "loading") setText("模型还在加载", p && p.progress != null ? `${Math.round(p.progress * 100)}%，日出前稍等一下` : "稍等一下");
    else if (s === "learned") setText(p.title, p.detail || "");
    else if (s === "error") p && typeof p === "object" ? setText(p.title, p.detail || "") : setText("没能完成", p || "");
  };

  window.hudLevel = (v) => {
    if (state === "listening") lvl = v;
  };

  // ---------------------------------------------------------------- the sun and its reflection
  // Drawn every display frame while the HUD is up (120 Hz on ProMotion); everything is
  // timed in seconds, so the motion is the same at any refresh rate. The voice reaches the sun first and travels down the
  // reflection: each stroke answers a little later than the one above, like a ripple, and
  // sways on the water. Silence still breathes; "thinking" sends a slow wave down.
  const cv = document.getElementById("sunset"), g = cv.getContext("2d");
  const CW = 36, CH = 46, DPR = Math.max(2, window.devicePixelRatio || 1);
  cv.width = CW * DPR; cv.height = CH * DPR; g.scale(DPR, DPR);
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  // the reflection: [y, half length, thickness, opacity, broken?] — wide under the sun,
  // narrowing and breaking up towards the viewer, as in the painting
  const STROKES = [[21, 11, 1.9, 0.92, false], [25.5, 9.5, 1.8, 0.78, false], [30, 8.5, 1.7, 0.64, true],
                   [34.5, 7, 1.6, 0.5, false], [38.5, 5.5, 1.5, 0.38, true], [42, 4, 1.4, 0.28, false]];
  const LAG = 0.055;                       // s between one stroke and the next
  const HN = 512, hv = new Float32Array(HN), ht = new Float64Array(HN); let hi = 0;  // recent voice and when
  let raf = 0, last = 0, t = 0, voice = 0, glow = 0, settle = 0, live = 0;

  function wake() { if (!raf) { last = performance.now(); raf = requestAnimationFrame(frame); } }
  function past(secs) {  // the voice `secs` ago
    const when = t - secs;
    for (let n = 0, j = hi; n < HN - 1; n++, j = (j - 1 + HN) % HN) if (ht[j] <= when) return hv[j];
    return 0;
  }
  const ease = (x, to, rate, dt) => x + (to - x) * (1 - Math.exp(-dt * rate));

  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now; t += still ? 0 : dt;
    const listening = state === "listening", thinking = state === "thinking";
    const dim = !(listening || thinking || state === "done" || state === "copied" || state === "learned");
    // the voice: quick to rise, slower to fall, so syllables read as pulses
    const target = listening ? Math.min(1, lvl * 1.15) : 0;
    voice = ease(voice, target, target > voice ? 22 : 7, dt);
    hi = (hi + 1) % HN; hv[hi] = voice; ht[hi] = t;
    live = ease(live, dim ? 0 : 1, 6, dt);
    settle = Math.max(0, settle - dt * 1.4);
    glow = ease(glow, listening ? voice : thinking ? 0.35 + 0.25 * Math.sin(t * 3.2) : settle * 0.8, 10, dt);
    draw(listening, thinking, dim);
    if (state === "hidden") { raf = 0; return; }
    raf = requestAnimationFrame(frame);
  }

  // monochrome: a white disc (sun or moon) and white strokes; dim states just fade
  function draw(listening, thinking, dim) {
    g.clearRect(0, 0, CW, CH);
    const cx = CW / 2, sunY = 9.5, ink = 0.42 + 0.58 * live;
    // a faint glow that swells with the voice, then the disc
    const r = 5.2 + glow * 0.7;
    const halo = g.createRadialGradient(cx, sunY, r, cx, sunY, Math.min(cx - 0.5, r + 3 + glow * 9));
    halo.addColorStop(0, `rgba(255,255,255,${(0.10 + glow * 0.32) * live})`);
    halo.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = halo; g.fillRect(0, 0, CW, CH);
    g.fillStyle = `rgba(255,255,255,${0.96 * ink})`;
    g.beginPath(); g.arc(cx, sunY, r, 0, Math.PI * 2); g.fill();
    // the reflection
    g.lineCap = "round";
    STROKES.forEach(([y, half, w, a, broken], i) => {
      let k;  // 0..1: how far this stroke reaches out right now
      if (listening) k = 0.45 + 0.8 * past(LAG * (i + 1));
      else if (thinking) k = 0.4 + 0.35 * Math.sin(t * 5.2 - i * 0.85);
      else k = 0.55 + settle * 0.5 * Math.sin(Math.PI * Math.min(1, settle + i * 0.08));
      k += 0.06 * Math.sin(t * 2.1 - i * 0.7);                 // the water never stops
      const len = half * Math.max(0.18, Math.min(1.25, k));
      const sway = Math.sin(t * 1.7 + i * 1.9) * (0.6 + 1.4 * k) * (0.5 + i * 0.12);
      const x = cx + sway;
      g.strokeStyle = `rgba(255,255,255,${a * ink})`;
      g.lineWidth = w;
      g.beginPath();
      if (broken && len > 3) {  // a gap in the stroke, drifting with the water
        const gap = 1.2 + 0.8 * Math.sin(t * 2.6 + i), off = Math.sin(t * 1.3 + i) * len * 0.3;
        g.moveTo(x - len, y); g.lineTo(x + off - gap, y);
        g.moveTo(x + off + gap, y); g.lineTo(x + len, y);
      } else {
        g.moveTo(x - len, y); g.lineTo(x + len, y);
      }
      g.stroke();
    });
  }
  draw(false, false, true);

  // design preview in a plain browser: cycle through the states
  if (!window.pywebview && location.search.includes("demo")) {
    const seq = [["listening", {}], ["partial", "我想要这个东西的 fail to pass 和 pass to pass"], ["partial", "我想要这个东西的 fail to pass 和 pass to pass 这两种测试"], ["thinking", {}], ["done", { text: "我想要这个东西的 fail to pass 和 pass to pass 这两种测试。", done_s: 0.42 }]];
    let i = 0; hudState({ state: "listening", payload: {} });
    // like speech: syllables come and go, phrases pause
    setInterval(() => { const x = Date.now() / 1000; if (state === "listening") hudLevel(Math.max(0, Math.abs(Math.sin(x * 6.5)) * (0.55 + 0.45 * Math.sin(x * 1.3)) + (Math.random() - 0.5) * 0.12)); }, 40);
    setInterval(() => { i = (i + 1) % seq.length; hudState({ state: seq[i][0], payload: seq[i][1] }); }, 2200);
  }
</script>
</body>
</html>
