# Windows preview build: an artifact on the run page, not a release.
name: windows-preview

on:
  push:
    branches: [claude/windows]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      VULKAN_VERSION: 1.4.357.0   # same as llama.cpp's CI
      CZ_VULKAN: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Vulkan SDK
        run: |
          curl.exe -o $env:RUNNER_TEMP/VulkanSDK-Installer.exe -L "https://sdk.lunarg.com/sdk/download/${env:VULKAN_VERSION}/windows/vulkansdk-windows-X64-${env:VULKAN_VERSION}.exe"
          & "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" --accept-licenses --default-answer --confirm-command install
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\${env:VULKAN_VERSION}"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\${env:VULKAN_VERSION}\bin"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Check platform code first (fast feedback)
        working-directory: native
        run: cargo check --release -p cz-platform -p cz-core

      - name: Build
        working-directory: native
        run: cargo build --release -p chengzhang

      - name: Package
        shell: pwsh
        run: |
          $dir = "Chengzhang-windows-x64"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item native/target/release/chengzhang.exe "$dir/Chengzhang.exe"
          Get-Item "$dir/Chengzhang.exe" | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: Chengzhang-0.2.0-windows-x64-preview
          path: Chengzhang-windows-x64
