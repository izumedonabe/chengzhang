[workspace]
resolver = "2"
members = ["crates/cz-llama", "crates/cz-core", "crates/cz-sim", "crates/cz-platform", "crates/cz-mlx", "app"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
rust-version = "1.89"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# the shell (Tauri, wry, tao…) is optimized for size; the inference path stays at -O3
[profile.release.package."*"]
opt-level = "s"
[profile.release.package.cz-core]
opt-level = 3
[profile.release.package.cz-llama]
opt-level = 3
[profile.release.package.earshot]
opt-level = 3
