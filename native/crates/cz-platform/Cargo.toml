[package]
name = "cz-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "成章 OS integration: global push-to-talk hotkey, paste into the frontmost app, permissions, no-focus HUD"

[dependencies]
serde = { version = "1", features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSGeometry", "objc2-core-foundation"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_System_Memory",
  "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi",
] }
