[workspace]
resolver = "2"
members = ["crates/cz-llama", "crates/cz-core", "crates/cz-sim", "crates/cz-platform", "crates/cz-mlx", "app"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
rust-version = "1.89"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# the shell (Tauri, wry, tao…) is optimized for size; the inference path stays at -O3
[profile.release.package."*"]
opt-level = "s"
# never strip dependencies (proc macros are among them): with MACOSX_DEPLOYMENT_TARGET=14.0 the
# Xcode 27 strip leaves dylibs dyld refuses to load ("mis-aligned LINKEDIT string pool"), and the
# release build then fails with "can't find crate". Only dylibs are affected; rlibs aren't stripped.
strip = "none"
[profile.release.package.cz-core]
opt-level = 3
[profile.release.package.cz-llama]
opt-level = 3
[profile.release.package.earshot]
opt-level = 3

# mlx-sys with MLX's CPU backend disabled (see third_party/mlx-sys/build.rs)
[patch.crates-io]
mlx-sys = { path = "third_party/mlx-sys" }
